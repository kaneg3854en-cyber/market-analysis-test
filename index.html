<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>マーケット分析</title>

<style>

*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}

.wrap{max-width:1100px;margin:auto;padding:18px}

header{background:white;border-radius:18px;padding:18px 22px;margin-bottom:14px;box-shadow:0 3px 14px #0001}

h1{margin:0;color:#1769d3;font-size:27px}.sub{color:#718096;margin-top:5px;font-size:13px}

h2{font-size:18px;color:#1769d3;margin:20px 0 10px}

.flow{background:white;border-radius:15px;padding:16px;box-shadow:0 3px 12px #0001;font-size:14px;line-height:1.8}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.card{background:white;border-radius:15px;padding:14px;box-shadow:0 3px 12px #0001}

.name{font-size:13px;color:#607089}.price{font-size:23px;font-weight:700;margin:5px 0}.chg{font-size:13px}.up{color:#07884b}.down{color:#d43b3b}.wait{color:#888}

.news{background:white;border-radius:15px;padding:14px;box-shadow:0 3px 12px #0001}

.news button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #edf0f5;padding:13px 4px;font-size:14px;color:#172033}

.currency{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cur{background:white;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0001}

.scenario{background:white;border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 2px 8px #0001}

@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.currency{grid-template-columns:repeat(2,1fr)}}

</style>

</head>

<body>

<div class="wrap">
