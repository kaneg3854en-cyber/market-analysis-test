<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE MARKET TEST</title>

<style>
body{
  margin:0;
  padding:25px;
  background:#07111f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

h1{
  text-align:center;
  color:#42b5ff;
  margin:10px 0 5px;
}

.sub{
  text-align:center;
  color:#9fb4c8;
  font-size:13px;
  margin-bottom:25px;
}

.card{
  max-width:430px;
  margin:15px auto;
  padding:22px;
  border:1px solid #329cff;
  border-radius:18px;
  background:#10243b;
  box-shadow:0 0 15px rgba(50,156,255,.15);
}

.name{
  font-size:20px;
  font-weight:bold;
}

.price{
  font-size:40px;
  font-weight:bold;
  margin:15px 0 5px;
}

.change{
  font-size:19px;
}

.status{
  margin-top:12px;
  font-size:12px;
  color:#9fb4c8;
}

.ok{
  color:#42d6ff;
}

.err{
  color:#ff6688;
}
</style>
</head>

<body>

<h1>LIVE MARKET TEST</h1>
<div class="sub">biquote.io リアルタイム接続テスト</div>

<div class="card">
  <div class="name">🛢️ 原油（Brent）</div>
  <div id="price" class="price">取得中…</div>
  <div id="change" class="change">--</div>
  <div id="status" class="status">接続確認中…</div>
</div>

<script>

async function getOil(){

  const price = document.getElementById("price");
  const change = document.getElementById("change");
  const status = document.getElementById("status");

  try{

    const response = await fetch(
      "https://biquote.io/api/UKOIL",
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data = await response.json();

    console.log(data);

    const mid = Number(data.mid);
    const diff = Number(data.dayDiffPercent);

    price.textContent = mid.toFixed(3);

    change.textContent =
      (diff >= 0 ? "+" : "") +
      diff.toFixed(2) +
      "%";

    change.style.color =
      diff >= 0 ? "#42d6ff" : "#ff6688";

    status.textContent =
      "● LIVE接続OK　" +
      new Date().toLocaleTimeString("ja-JP");

    status.className = "status ok";

  }catch(error){

    price.textContent = "取得失敗";

    status.textContent =
      "接続エラー：" + error.message;

    status.className = "status err";

    console.error(error);
  }
}

getOil();

setInterval(getOil,15000);

</script>

</body>
</html>
