<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE接続テスト</title>
<style>
body{font-family:Arial,sans-serif;background:#eaf6ff;color:#10204d;padding:20px}
h1{color:#0757b5}
.card{background:white;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #ccd}
.price{font-size:28px;font-weight:bold}
.up{color:red}.down{color:blue}
</style>
</head>
<body>

<h1>📊 LIVE MARKET TEST</h1>
<p>5銘柄を15秒ごとに更新</p>

<div class="card">🛢️ Brent<br><span class="price" id="UKOIL">取得中...</span></div>
<div class="card">🪙 Gold<br><span class="price" id="XAUUSD">取得中...</span></div>
<div class="card">💲 DXY<br><span class="price" id="DXY">取得中...</span></div>
<div class="card">🇯🇵 日経225<br><span class="price" id="JP225">取得中...</span></div>
<div class="card">🇺🇸 S&P500<br><span class="price" id="US500">取得中...</span></div>

<script>
const symbols=["UKOIL","XAUUSD","DXY","JP225","US500"];

async function get(s){
 try{
  const r=await fetch("https://biquote.io/api/"+s+"?allowStale=true");
  const d=await r.json();
  const p=d.mid??d.price??d.lastPrice??d.last;
  const ch=d.dayDiffPercent??d.changePercent;
  document.getElementById(s).innerHTML=
   p==null?"取得失敗":p+"　"+(ch>=0?"▲ ":"▼ ")+Number(ch).toFixed(2)+"%";
 }catch(e){
  document.getElementById(s).textContent="接続失敗";
 }
}

function update(){
 symbols.forEach(get);
}
update();
setInterval(update,15000);
</script>

</body>
</html>
